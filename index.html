<style>
:root{--bg:#fff;--surface:#fff;--ink:#0b0b0f;--mute:#6b7280;--line:#ececf0;--s1:#ff4d2e;--s2:#1f6bff;--s3:#0fa968;
--shadow:0 1px 2px rgba(11,11,15,.05),0 12px 30px -14px rgba(11,11,15,.22);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.serif{font-family:ui-serif,Georgia,"Times New Roman",serif}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--s2);outline-offset:2px}
.top{background:rgba(255,255,255,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top-in{max-width:1100px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.logo{width:40px;height:40px;border-radius:13px;background:var(--ink);display:grid;place-items:center;transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.brand:hover .logo{transform:rotate(-12deg) scale(1.08)}
.brand b{font-size:18px;display:block;line-height:1.1}
.brand small{color:var(--mute);font-size:12px}
.sp{flex:1}
.btn{border:0;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;transition:transform .2s,box-shadow .2s;box-shadow:0 6px 16px -6px rgba(11,11,15,.5)}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.95)}
.wrap{max-width:1100px;margin:0 auto;padding:22px 18px 48px}
.hero{padding:22px 0 30px}
.hero h1{font-size:clamp(34px,7vw,64px);line-height:1;margin:0 0 14px;letter-spacing:-.03em;font-weight:700}
.hero p{margin:0;max-width:54ch;color:var(--mute);font-size:17px}
.enter .hero h1{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}.enter .hero p{animation:rise .6s .1s cubic-bezier(.2,.7,.2,1) both}
.sectors{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.sc{--c:var(--s1);text-align:left;border:1.5px solid var(--line);background:radial-gradient(circle at 100% 0,color-mix(in srgb,var(--c) 15%,transparent),transparent 62%),#fff;border-radius:28px;padding:24px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .25s cubic-bezier(.3,1.4,.5,1),box-shadow .25s,border-color .25s}
.a .sc{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}.a .sc:nth-child(1){animation-delay:.15s}.a .sc:nth-child(2){animation-delay:.25s}.a .sc:nth-child(3){animation-delay:.35s}
.sc:hover{transform:translateY(-6px) rotate(-.4deg);border-color:var(--c);box-shadow:0 22px 40px -18px var(--c)}.sc:active{transform:scale(.97)}
.sc h2{margin:0;font-size:15px;font-weight:700;color:var(--c)}
.sc .n{font-size:52px;line-height:1;font-weight:700;margin:12px 0 4px;letter-spacing:-.03em}
.sc .r{color:var(--mute);font-size:15px}
.bar{height:10px;border-radius:9px;background:color-mix(in srgb,var(--c) 14%,#fff);margin:20px 0 10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:9px;transform-origin:left;animation:gx 1s .4s cubic-bezier(.2,.7,.2,1) both}
@keyframes gx{from{transform:scaleX(0)}}
.sc .cnt{font-size:14px;font-weight:700}
.s1{--c:var(--s1)}.s2{--c:var(--s2)}.s3{--c:var(--s3)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.enter{animation:fade .35s both}@keyframes fade{from{opacity:0}to{opacity:1}}
.note{margin-top:26px;padding:16px 18px;border-radius:18px;background:#f6f6f8;color:var(--mute);font-size:14px}
.sh{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.sh h1{margin:0;font-size:clamp(32px,6vw,48px);color:var(--c);line-height:1;letter-spacing:-.03em;font-weight:700}
.sh p{margin:6px 0 0;color:var(--mute)}
.tabs{display:flex;gap:8px;margin:0 0 22px;flex-wrap:wrap}
.tab{--c:var(--s1);border:1.5px solid var(--line);background:#fff;padding:9px 18px;border-radius:999px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;transition:transform .2s,background .25s,color .25s}
.tab::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c);transition:background .25s}
.tab:hover{transform:translateY(-2px)}.tab:active{transform:scale(.94)}
.tab[aria-current=true]{background:var(--c);border-color:var(--c);color:#fff}.tab[aria-current=true]::before{background:#fff}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.t{--c:var(--s1);text-align:left;min-height:132px;padding:16px;border-radius:24px;border:1.5px solid var(--line);background:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .25s cubic-bezier(.3,1.4,.5,1),box-shadow .25s,background .3s,color .3s}
.a .t{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*22ms)}
.t:hover{transform:translateY(-5px)}.t:active{transform:scale(.94)}
.t .num{font-size:38px;font-weight:700;line-height:1;letter-spacing:-.03em}
.t .st{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--s3);margin-top:auto;padding-top:12px}
.t .st::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--s3);flex:none}
.t .pv{font-size:13px;opacity:.92;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:8px;word-break:break-word}
.t.occ{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 16px 28px -14px var(--c)}
.t.occ .st{color:#fff}.t.occ .st::before{background:#fff;animation:pl 2s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}70%,100%{box-shadow:0 0 0 9px rgba(255,255,255,0)}}
dialog{border:0;padding:0;background:#fff;color:var(--ink);border-radius:28px;width:min(640px,calc(100% - 24px));box-shadow:0 30px 80px -20px rgba(0,0,0,.45);max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(11,11,15,.45);backdrop-filter:blur(4px);animation:fade .25s}
dialog[open]{animation:pop .35s cubic-bezier(.2,.9,.3,1.1)}
@keyframes pop{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:none}}
@media (max-width:640px){dialog{margin:auto 0 0;width:100%;max-width:100%;border-radius:28px 28px 0 0;max-height:94%}}
.eh{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line);border-top:8px solid var(--c)}
.eh h3{margin:0;font-size:30px;line-height:1.05;letter-spacing:-.02em;color:var(--c)}.eh small{color:var(--mute);font-size:14px}
.x{margin-left:auto;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-weight:700;transition:transform .2s}.x:active{transform:scale(.94)}
textarea{display:block;width:100%;min-height:min(48vh,380px);border:0;resize:none;padding:18px 20px;background:#fff;color:var(--ink);font:18px/1.6 system-ui,sans-serif;outline:0}
.ef{display:flex;gap:10px;align-items:center;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.ef span{color:var(--mute);font-size:13px;flex:1;min-width:120px}
.b2{border:0;border-radius:999px;padding:13px 20px;font-weight:700;background:var(--c);color:#fff;transition:transform .2s,background .25s}
.b2:active,.b3:active{transform:scale(.95)}.b2.warn{background:#d92d20;animation:shk .4s}
@keyframes shk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.b3{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:12px 18px;font-weight:700;transition:transform .2s}
.pd{padding:22px}.pd h3{margin:0 0 6px;font-size:26px}.pd p{margin:0 0 18px;color:var(--mute)}
.pd .b2,.pd .b3{display:block;width:100%;margin-bottom:10px;text-align:left}.pd .b2{background:var(--ink)}
#print{display:none}
@media print{
 body{background:#fff;color:#000}#app,dialog{display:none!important}#print{display:block}
 #print h1{font:700 22px ui-serif,Georgia,serif;margin:0 0 4px}#print .m{color:#555;font-size:12px;margin-bottom:16px}
 .pt{break-inside:avoid;border:1.5px solid #333;border-radius:8px;margin:0 0 12px;padding:10px 12px}
 .pt h2{font:700 16px system-ui,sans-serif;margin:0 0 6px;padding-bottom:6px;border-bottom:1px solid #999;display:flex;justify-content:space-between}
 .pt pre{white-space:pre-wrap;word-break:break-word;font:13px/1.5 system-ui,sans-serif;margin:0}
 .pt .e{color:#888;font-style:italic}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
 <header class="top"><div class="top-in">
  <button class="brand" data-go="home" aria-label="Início">
   <span class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="3.2"/><path d="M12 1.5v2M12 20.5v2"/></svg></span>
   <span><b class="serif">Comanda</b><small>Plano B do salão</small></span>
  </button><span class="sp"></span>
  <button class="btn" id="pdfBtn">Gerar PDF</button>
 </div></header>
 <main class="wrap" id="main"></main>
</div>

<dialog id="ed"><div id="edw"></div></dialog>
<dialog id="pd"><div class="pd">
 <h3 class="serif">Gerar PDF das comandas</h3>
 <p>Cada mesa sai identificada com número e setor. Na janela de impressão, escolha “Salvar como PDF”.</p>
 <button class="b2" data-pdf="occ">Somente mesas ocupadas</button>
 <button class="b3" data-pdf="all">Todas as 50 mesas</button>
 <button class="b3" data-pdf="x">Cancelar</button>
</div></dialog>
<div id="print"></div>

<script>
const KEY="comanda-emergencia-v1";
const SEC=[{id:1,a:1,b:14},{id:2,a:15,b:24},{id:3,a:25,b:50}];
let D={};try{D=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
const $=s=>document.querySelector(s),p2=n=>String(n).padStart(2,"0");
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const occ=n=>!!(D[n]&&D[n].t&&D[n].t.trim());
const secOf=n=>SEC.find(s=>n>=s.a&&n<=s.b);
const hm=ts=>new Date(ts).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
const count=s=>{let c=0;for(let n=s.a;n<=s.b;n++)if(occ(n))c++;return c};
function render(a){
 const h=location.hash,m=h.match(/^#setor-(\d)$/),main=$("#main");main.className=a?"enter":"";
 if(!m){
  const tot=SEC.reduce((a,s)=>a+count(s),0);
  main.innerHTML=`<section class="hero"><h1 class="serif">Anote agora.<br>Lance depois.</h1><p>Use quando o sistema principal estiver fora do ar. Escreva os pedidos à mão, mesa por mesa. Tudo fica salvo neste aparelho, mesmo se a página for atualizada.</p></section>
  <div class="sectors${a?" a":""}">${SEC.map(s=>{const c=count(s),t=s.b-s.a+1;return `<button class="sc s${s.id}" data-go="setor-${s.id}"><h2>Setor ${s.id}</h2><div class="n serif">${p2(s.a)}–${p2(s.b)}</div><div class="r">${t} mesas</div><div class="bar"><i style="width:${c/t*100}%"></i></div><div class="cnt">${c} ocupada${c==1?"":"s"} · ${t-c} livre${t-c==1?"":"s"}</div></button>`}).join("")}</div>
  <div class="note">${tot} de 50 mesas com anotações. Os dados ficam só neste aparelho. Para recuperá-los depois, gere o PDF antes de limpar as mesas.</div>`;
  document.title="Comanda de Emergência";return;
 }
 const s=SEC[m[1]-1];if(!s){location.hash="";return}
 let g="";for(let n=s.a;n<=s.b;n++){const o=occ(n);g+=`<button class="t${o?" occ":""}" style="--i:${n-s.a}" data-t="${n}"><span class="num serif">${p2(n)}</span>${o?`<span class="pv">${esc(D[n].t.trim())}</span>`:""}<span class="st">${o?"Ocupada · "+hm(D[n].at):"Livre"}</span></button>`}
 main.innerHTML=`<div class="s${s.id}"><div class="sh"><div><h1 class="serif" style="--c:var(--s${s.id})">Setor ${s.id}</h1><p>Mesas ${p2(s.a)} a ${p2(s.b)} · ${count(s)} ocupada${count(s)==1?"":"s"}</p></div></div>
 <nav class="tabs">${SEC.map(x=>`<button class="tab s${x.id}" data-go="setor-${x.id}" ${x.id==s.id?'aria-current="true"':""}>Setor ${x.id}</button>`).join("")}</nav>
 <div class="grid${a?" a":""}">${g}</div></div>`;
 document.title="Setor "+s.id+" · Comanda";
}
function openT(n){
 const s=secOf(n),d=$("#ed");
 $("#edw").innerHTML=`<div class="s${s.id}" style="--c:var(--s${s.id})"><div class="eh"><div><h3 class="serif">Mesa ${p2(n)}</h3><small>Setor ${s.id}</small></div><button class="x" data-close>Fechar</button></div>
 <textarea id="ta" placeholder="Escreva aqui: itens, quantidades, observações e valores." aria-label="Anotações da mesa ${p2(n)}" spellcheck="false"></textarea>
 <div class="ef"><span id="sv">Salvo automaticamente</span><button class="b3" data-close>Voltar às mesas</button><button class="b2" id="fin">Finalizar atendimento</button></div></div>`;
 const ta=$("#ta");ta.value=D[n]?D[n].t:"";
 ta.oninput=()=>{const e=D[n]||(D[n]={t:"",at:Date.now()});if(!e.t.trim())e.at=Date.now();e.t=ta.value;save();$("#sv").textContent="Salvo às "+hm(Date.now())};
 let arm;$("#fin").onclick=function(){
  if(!this.classList.contains("warn")){this.classList.add("warn");this.textContent="Confirmar: limpar mesa";arm=setTimeout(()=>{this.classList.remove("warn");this.textContent="Finalizar atendimento"},4000);return}
  clearTimeout(arm);delete D[n];save();d.close();
 };
 d.showModal();if(!ta.value)ta.focus();
}
function pdf(all){
 const box=$("#print"),now=new Date();let h=`<h1>Comandas de emergência</h1><div class="m">Emitido em ${now.toLocaleString("pt-BR")}</div>`,k=0;
 for(let n=1;n<=50;n++){const o=occ(n);if(!all&&!o)continue;k++;
  h+=`<div class="pt"><h2><span>Mesa ${p2(n)}</span><span>Setor ${secOf(n).id}${o?" · aberta às "+hm(D[n].at):""}</span></h2>${o?`<pre>${esc(D[n].t.trim())}</pre>`:`<div class="e">Sem anotações</div>`}</div>`}
 if(!k)h+=`<div class="pt"><div class="e">Nenhuma mesa ocupada.</div></div>`;
 box.innerHTML=h;const t=document.title,f=now.toISOString().slice(0,16).replace(/[-:T]/g,"");
 document.title="Comandas-"+f;setTimeout(()=>{window.print();document.title=t},50);
}
document.addEventListener("click",e=>{
 const g=e.target.closest("[data-go]"),t=e.target.closest("[data-t]"),c=e.target.closest("[data-close]"),q=e.target.closest("[data-pdf]");
 if(g){location.hash=g.dataset.go==="home"?"":g.dataset.go;scrollTo(0,0)}
 else if(t)openT(+t.dataset.t);
 else if(c){$("#ed").close()}
 else if(q){$("#pd").close();if(q.dataset.pdf!=="x")pdf(q.dataset.pdf==="all")}
});
$("#pdfBtn").onclick=()=>$("#pd").showModal();
$("#ed").addEventListener("close",()=>render());
addEventListener("hashchange",()=>render(true));
addEventListener("storage",e=>{if(e.key===KEY){try{D=JSON.parse(e.newValue)||{}}catch(x){}render()}});
render(true);
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){try{navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}}
</script>
</body>
</html>
