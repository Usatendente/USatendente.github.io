:root{--bg:#ffffff;--ink:#1a1a1a;--mute:#5f5f5f;--soft:#8a8a8a;--red:#cc3300;--org:#f58634;--line:rgba(204,204,204,.55);--sh:0 1px 2px rgba(0,0,0,.05),0 8px 22px -12px rgba(0,0,0,.18);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#fff;color:var(--ink);font:400 16px/1.45 GeneralSans,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid rgba(204,51,0,.45);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:24px 24px 56px}
.s1,.s2,.s3{--c:#111;--on:#fff}
.hd{display:flex;align-items:center;gap:12px}
.brand{background:none;border:0;padding:0;text-align:left;display:flex;align-items:center;gap:12px}.brand img{height:46px;width:auto;display:block;background:#000;border-radius:12px;padding:5px 9px;box-sizing:border-box}@media (max-width:440px){.brand span{display:none}}
.brand small{display:block;font-size:14px;opacity:.9}
.brand h1{margin:0;font-size:24px;font-weight:400;line-height:1.15;letter-spacing:.01em}.brand h1 b{font-weight:700}
.sp{flex:1}
.pill{border:1px solid #111;background:#111;color:#fff;border-radius:48px;padding:12px 22px;font-weight:600;transition:transform .2s,background .25s,border-color .25s,color .25s,box-shadow .25s}
.pill:hover{background:var(--red);border-color:var(--red);box-shadow:0 10px 20px -10px var(--red)}.pill:active{transform:scale(.95);background:var(--org);border-color:var(--org)}
.pill.sm{padding:9px 18px;font-size:14px}
.pill.out{background:#fff;color:#111;border:1px solid #111}.pill.out:hover{background:#fff;color:var(--red);border-color:var(--red)}.pill.out:active{color:var(--org);border-color:var(--org);background:#fff}
.link{background:none;border:0;padding:6px;color:#111;font-weight:600;font-size:14px;transition:color .2s}.link:hover{color:var(--red)}.link:active{color:var(--org)}
.intro{margin:30px 0 22px}
.intro h2{margin:0 0 6px;font-size:24px;font-weight:600}.intro p{margin:0;color:var(--mute);max-width:52ch}
.list{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:16px;text-align:left;background:#fff;border:1px solid rgba(0,0,0,.09);border-radius:12px;padding:18px;box-shadow:var(--sh);transition:transform .22s cubic-bezier(.3,1.4,.5,1),border-color .2s}
.row:hover{transform:translateY(-3px);border-color:var(--org);box-shadow:0 14px 26px -14px var(--org)}.row:active{transform:scale(.98)}
.a .row{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*90ms)}
.bd{--x:0;width:52px;height:52px;border-radius:50%;background:#fff;box-shadow:0 2px 1px rgba(0,0,0,.1),0 6px 14px -6px rgba(0,0,0,.25);display:grid;place-items:center;font-weight:700;font-size:22px;color:var(--c);flex:none}
.rt{flex:1;min-width:0}.rt b{display:block;font-size:18px;font-weight:600}.rt small{color:var(--mute);font-size:14px}
.bar{display:block;height:6px;border-radius:6px;background:color-mix(in srgb,var(--c) 16%,#fff);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:6px;transform-origin:left;animation:gx .9s .3s cubic-bezier(.2,.7,.2,1) both}
@keyframes gx{from{transform:scaleX(0)}}
