:root{--bg:#fafafa;--ink:#1a1a1a;--mute:#5f5f5f;--soft:#8a8a8a;--red:#cc3300;--line:rgba(204,204,204,.55);--sh:0 1px 2px rgba(0,0,0,.05),0 8px 22px -12px rgba(0,0,0,.18);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 GeneralSans,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid rgba(204,51,0,.45);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:24px 24px 56px}
.s1{--c:#cc3300;--on:#fff}.s2{--c:#f58634;--on:#1a0f05}.s3{--c:#111;--on:#fff}
.hd{display:flex;align-items:center;gap:12px}
.brand{background:none;border:0;padding:0;text-align:left;display:flex;align-items:center;gap:12px}.brand img{height:40px;width:auto;display:block}@media (max-width:440px){.brand span{display:none}}
.brand small{display:block;font-size:14px;opacity:.9}
.brand h1{margin:0;font-size:24px;font-weight:400;line-height:1.15;letter-spacing:.01em}.brand h1 b{font-weight:700}
.sp{flex:1}
.pill{border:0;background:var(--red);color:#fff;border-radius:48px;padding:12px 22px;font-weight:600;transition:transform .2s,opacity .2s}
.pill:active{transform:scale(.95)}.pill:hover{opacity:.92}
.pill.sm{padding:9px 18px;font-size:14px}
.pill.out{background:#fff;color:var(--red);border:1px solid var(--red)}
.link{background:none;border:0;padding:6px;color:var(--red);font-weight:600;font-size:14px}
.intro{margin:30px 0 22px}
.intro h2{margin:0 0 6px;font-size:24px;font-weight:600}.intro p{margin:0;color:var(--mute);max-width:52ch}
.list{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:16px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--sh);transition:transform .22s cubic-bezier(.3,1.4,.5,1),border-color .2s}
.row:hover{transform:translateY(-3px);border-color:var(--c)}.row:active{transform:scale(.98)}
.a .row{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*90ms)}
.bd{--x:0;width:52px;height:52px;border-radius:50%;background:#fff;box-shadow:0 2px 1px rgba(0,0,0,.1),0 6px 14px -6px rgba(0,0,0,.25);display:grid;place-items:center;font-weight:700;font-size:22px;color:var(--c);flex:none}
.rt{flex:1;min-width:0}.rt b{display:block;font-size:18px;font-weight:600}.rt small{color:var(--mute);font-size:14px}
.bar{display:block;height:6px;border-radius:6px;background:color-mix(in srgb,var(--c) 16%,#fff);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:6px;transform-origin:left;animation:gx .9s .3s cubic-bezier(.2,.7,.2,1) both}
@keyframes gx{from{transform:scaleX(0)}}
.cn{text-align:right;flex:none}.cn b{display:block;font-size:28px;font-weight:700;line-height:1;color:var(--ink)}.cn small{font-size:12px;color:var(--soft)}
.note{margin-top:22px;font-size:14px;color:var(--soft)}
.cats{display:flex;gap:6px;margin:26px 0 22px}
.cat{background:none;border:0;padding:0 24px 0 0;display:flex;flex-direction:column;align-items:center;gap:8px;opacity:.55;transition:opacity .2s}
.cat .ic{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:700;color:var(--ink);box-shadow:0 2px 1px rgba(0,0,0,.1);transition:transform .3s cubic-bezier(.3,1.6,.5,1),background .25s,color .25s}
.cat span{font-size:14px;font-weight:600}
.cat:active .ic{transform:scale(.9)}
.cat[aria-current=true]{opacity:1}.cat[aria-current=true] .ic{background:var(--c);color:var(--on);transform:scale(1.08)}
.sh h2{margin:0;font-size:24px;font-weight:600}.sh p{margin:2px 0 18px;color:var(--mute);font-size:15px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.t{text-align:left;min-height:118px;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:#fff;box-shadow:var(--sh);display:flex;flex-direction:column;transition:transform .22s cubic-bezier(.3,1.4,.5,1),background .3s,color .3s}
.a .t{animation:rise .45s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*22ms)}
.t:hover{transform:translateY(-4px)}.t:active{transform:scale(.95)}
.t .lb{font-size:13px;color:var(--soft)}
.t .num{font-size:34px;font-weight:700;line-height:1.05;letter-spacing:-.01em}
.t .st{margin-top:auto;padding-top:10px;font-size:13px;color:var(--soft);font-weight:600;display:flex;align-items:center;gap:7px}
.t .pv{font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;margin-top:4px}
.t.occ{background:var(--c);border-color:var(--c);color:var(--on);box-shadow:0 14px 24px -14px var(--c)}
.t.occ .lb,.t.occ .st{color:inherit;opacity:.9}
.t.occ .st::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;animation:pl 2s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 currentColor}70%,100%{box-shadow:0 0 0 8px transparent}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.enter{animation:fade .3s both}@keyframes fade{from{opacity:0}to{opacity:1}}
dialog{border:0;padding:0;background:var(--bg);color:var(--ink);border-radius:12px;width:min(560px,calc(100% - 32px));box-shadow:0 30px 80px -20px rgba(0,0,0,.5);max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(0,0,0,.6);animation:fade .25s}
dialog[open]{animation:pop .3s cubic-bezier(.2,.9,.3,1.1)}
@keyframes pop{from{opacity:0;transform:translateY(28px) scale(.97)}to{opacity:1;transform:none}}
.mb{padding:24px}
.mh{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mh h3{margin:0;font-size:24px;font-weight:600}
.tb{margin-top:16px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:8px;color:var(--mute)}
textarea{display:block;width:100%;min-height:min(40vh,300px);margin-top:16px;border:1px solid var(--line);border-radius:8px;resize:none;padding:14px;background:#fff;color:var(--ink);font:400 18px/1.55 GeneralSans,system-ui,sans-serif;outline:0}
textarea:focus{border-color:var(--red)}
.sv{margin:8px 0 18px;font-size:13px;color:var(--soft)}
.btns{display:flex;flex-direction:column;gap:10px}
.pill.warn{animation:shk .4s;background:#8f2400}
@keyframes shk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pd p{margin:10px 0 20px;color:var(--mute)}
#print{display:none}
@media print{
 body{background:#fff;color:#000}.wrap,dialog{display:none!important}#print{display:block}
 #print h1{font:700 22px system-ui,sans-serif;margin:0 0 4px}#print .m{color:#555;font-size:12px;margin-bottom:16px}
 .pt{break-inside:avoid;border:1.5px solid #333;border-radius:8px;margin:0 0 12px;padding:10px 12px}
 .pt h2{font:700 16px system-ui,sans-serif;margin:0 0 6px;padding-bottom:6px;border-bottom:1px solid #999;display:flex;justify-content:space-between}
 .pt pre{white-space:pre-wrap;word-break:break-word;font:13px/1.5 system-ui,sans-serif;margin:0}
 .pt .e{color:#888;font-style:italic}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
const KEY="comanda-emergencia-v1";
const SEC=[{id:1,a:1,b:14},{id:2,a:15,b:24},{id:3,a:25,b:50}];
let D={};try{D=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
const $=s=>document.querySelector(s),p2=n=>String(n).padStart(2,"0");
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const occ=n=>!!(D[n]&&D[n].t&&D[n].t.trim());
const secOf=n=>SEC.find(s=>n>=s.a&&n<=s.b);
const hm=ts=>new Date(ts).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
const count=s=>{let c=0;for(let n=s.a;n<=s.b;n++)if(occ(n))c++;return c};
const plural=(c,a,b)=>c==1?a:b;
function render(a){
 const m=location.hash.match(/^#setor-(\d)$/),main=$("#main");main.className=a?"enter":"";
 if(!m){
  const tot=SEC.reduce((x,s)=>x+count(s),0);
  main.innerHTML=`<section class="intro"><h2>Setores</h2><p>Escolha um setor e anote os pedidos à mão, mesa por mesa. Tudo fica salvo neste aparelho, mesmo ao atualizar a página.</p></section>
  <div class="list${a?" a":""}">${SEC.map(s=>{const c=count(s),t=s.b-s.a+1;return `<button class="row s${s.id}" style="--i:${s.id}" data-go="setor-${s.id}"><span class="bd">${s.id}</span><span class="rt"><b>Setor ${s.id}</b><small>Mesas ${p2(s.a)} a ${p2(s.b)}</small><span class="bar"><i style="width:${c/t*100}%"></i></span></span><span class="cn"><b>${c}</b><small>${plural(c,"ocupada","ocupadas")}</small></span></button>`}).join("")}</div>
  <p class="note">${tot} de 50 mesas com anotações. Gere o PDF antes de limpar as mesas se precisar guardar o registro.</p>`;
  document.title="US Motoca · Comanda";return;
 }
 const s=SEC[m[1]-1];if(!s){location.hash="";return}
 let g="";for(let n=s.a;n<=s.b;n++){const o=occ(n);g+=`<button class="t${o?" occ":""}" style="--i:${n-s.a}" data-t="${n}"><span class="lb">Mesa</span><span class="num">${p2(n)}</span>${o?`<span class="pv">${esc(D[n].t.trim())}</span>`:""}<span class="st">${o?"Ocupada · "+hm(D[n].at):"Livre"}</span></button>`}
 const c=count(s);
 main.innerHTML=`<nav class="cats">${SEC.map(x=>`<button class="cat s${x.id}" data-go="setor-${x.id}" ${x.id==s.id?'aria-current="true"':""}><span class="ic">${x.id}</span><span>Setor ${x.id}</span></button>`).join("")}</nav>
 <div class="sh"><h2>Setor ${s.id}</h2><p>Mesas ${p2(s.a)} a ${p2(s.b)} · ${c} ${plural(c,"ocupada","ocupadas")}</p></div>
 <div class="grid s${s.id}${a?" a":""}">${g}</div>`;
 document.title="Setor "+s.id+" · US Motoca";
}
function openT(n){
 const s=secOf(n),d=$("#ed");
 $("#edw").innerHTML=`<div class="mb"><div class="mh"><h3>Pedido</h3><button class="link" data-close>Fechar</button></div>
 <div class="tb">Mesa ${p2(n)} · Setor ${s.id}</div>
 <textarea id="ta" placeholder="Itens, quantidades, observações e valores" aria-label="Anotações da mesa ${p2(n)}" spellcheck="false"></textarea>
 <div class="sv" id="sv">Salvo automaticamente</div>
 <div class="btns"><button class="pill" id="fin">Finalizar atendimento</button></div></div>`;
 const ta=$("#ta");ta.value=D[n]?D[n].t:"";
 ta.oninput=()=>{const e=D[n]||(D[n]={t:"",at:Date.now()});if(!e.t.trim())e.at=Date.now();e.t=ta.value;save();$("#sv").textContent="Salvo às "+hm(Date.now())};
 let arm;$("#fin").onclick=function(){
  if(!this.classList.contains("warn")){this.classList.add("warn");this.textContent="Confirmar: limpar mesa";arm=setTimeout(()=>{this.classList.remove("warn");this.textContent="Finalizar atendimento"},4000);return}
  clearTimeout(arm);delete D[n];save();d.close();
 };
 d.showModal();if(!ta.value)ta.focus();
}
function pdf(all){
 const box=$("#print"),now=new Date();let h=`<h1>Comandas de emergência</h1><div class="m">Emitido em ${now.toLocaleString("pt-BR")}</div>`,k=0;
 for(let n=1;n<=50;n++){const o=occ(n);if(!all&&!o)continue;k++;
  h+=`<div class="pt"><h2><span>Mesa ${p2(n)}</span><span>Setor ${secOf(n).id}${o?" · aberta às "+hm(D[n].at):""}</span></h2>${o?`<pre>${esc(D[n].t.trim())}</pre>`:`<div class="e">Sem anotações</div>`}</div>`}
 if(!k)h+=`<div class="pt"><div class="e">Nenhuma mesa ocupada.</div></div>`;
 box.innerHTML=h;const t=document.title,f=now.toISOString().slice(0,16).replace(/[-:T]/g,"");
 document.title="Comandas-"+f;setTimeout(()=>{window.print();document.title=t},50);
}
document.addEventListener("click",e=>{
 const g=e.target.closest("[data-go]"),t=e.target.closest("[data-t]"),c=e.target.closest("[data-close]"),q=e.target.closest("[data-pdf]");
 if(g){location.hash=g.dataset.go==="home"?"":g.dataset.go;scrollTo(0,0)}
 else if(t)openT(+t.dataset.t);
 else if(c){$("#ed").close()}
 else if(q){$("#pd").close();if(q.dataset.pdf!=="x")pdf(q.dataset.pdf==="all")}
});
$("#pdfBtn").onclick=()=>$("#pd").showModal();
$("#ed").addEventListener("close",()=>render());
addEventListener("hashchange",()=>render(true));
addEventListener("storage",e=>{if(e.key===KEY){try{D=JSON.parse(e.newValue)||{}}catch(x){}render()}});
render(true);
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){try{navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}}
</script>
</body>
</html>
